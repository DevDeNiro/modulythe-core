name: Release to Maven Central

on:
    push:
        tags: [ "v*" ]
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Set up JDK 21 + Maven Central credentials + GPG key
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: 'maven'
                    server-id: central
                    server-username: CENTRAL_USERNAME
                    server-password: CENTRAL_PASSWORD
                    gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
                    gpg-passphrase: GPG_PASSPHRASE

            -   name: Verify tag matches pom version
                if: github.event_name == 'push'
                run: |
                    POM_VERSION=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
                    TAG_VERSION="${GITHUB_REF_NAME#v}"
                    echo "pom=$POM_VERSION tag=$TAG_VERSION"
                    if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
                        echo "::error::pom.xml version ($POM_VERSION) does not match tag ($TAG_VERSION)"
                        exit 1
                    fi

            -   name: Build, sign and deploy to Maven Central
                run: ./mvnw -B -ntp -P release clean deploy -DskipTests
                env:
                    CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
                    CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
                    GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

            -   name: Collect artifacts for GitHub Release
                if: github.event_name == 'push'
                run: |
                    mkdir -p release-assets
                    find . -path ./release-assets -prune -o \
                        \( -name '*.jar' -o -name '*.jar.asc' -o -name '*.pom.asc' \) \
                        -path '*/target/*' -print -exec cp {} release-assets/ \;
                    ls -la release-assets/

            -   name: Create GitHub Release
                if: github.event_name == 'push'
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ github.ref_name }}
                    name: ${{ github.ref_name }}
                    generate_release_notes: true
                    draft: true
                    prerelease: ${{ contains(github.ref_name, '-') }}
                    files: release-assets/*
                    body: |
                        Maven Central: https://central.sonatype.com/artifact/com.modulythe.framework/modulythe-core/${{ github.ref_name }}

                        ```xml
                        <dependency>
                            <groupId>com.modulythe.framework</groupId>
                            <artifactId>modulythe-core</artifactId>
                            <version>${{ github.ref_name }}</version>
                        </dependency>
                        ```
